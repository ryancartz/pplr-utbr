<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular YouTuber Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ff4757;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        header a {
            color: white;
            text-decoration: none;
            background-color: #2ed573;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .quiz-container {
            background-color: white;
            margin: 20px auto;
            padding: 20px;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .quiz-container h2 {
            color: #ff4757;
        }
        .quiz-container p {
            font-size: 18px;
        }
        .quiz-container button {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .quiz-container button:hover {
            background-color: #1e9050;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        footer a {
            color: #2ed573;
            text-decoration: none;
        }
        .timer {
            font-size: 20px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 10px;
        }
        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Popular YouTuber Quiz</h1>
        <a href="https://example.com/follow">Follow</a>
    </header>

    <div class="quiz-container">
        <h2>Quiz Question</h2>
        <p><strong>Who is the most popular YouTuber in the world?</strong></p>
        <p>Select the correct answer within <span class="timer" id="timer">10</span> seconds:</p>
        <form id="quiz-form">
            <label>
                <input type="radio" name="youtuber" value="PewDiePie"> PewDiePie
            </label><br>
            <label>
                <input type="radio" name="youtuber" value="MrBeast"> MrBeast
            </label><br>
            <label>
                <input type="radio" name="youtuber" value="T-Series"> T-Series
            </label><br>
            <label>
                <input type="radio" name="youtuber" value="Dude Perfect"> Dude Perfect
            </label><br>
        </form>
        <button onclick="checkAnswer()">Submit Answer</button>
        <button onclick="window.location.href='https://ryancartz.github.io/pplr-blg/'">Know More</button>
        <p id="result" style="color: #ff4757; font-weight: bold;"></p>
    </div>

    <footer>
        <p>Visit our website: <a href="https://youtube.com/@ryanquiz-k7n?si=47dmywXoK3mivM6g">youtube.com</a></p>
    </footer>

    <script>
        let timeLeft = 10;
        const timerElement = document.getElementById("timer");
        const quizForm = document.getElementById("quiz-form");
        const timerInterval = setInterval(updateTimer, 1000);

        function updateTimer() {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                disableQuiz();
                document.getElementById("result").innerText = "Time's up! The correct answer is PewDiePie.";
            }
        }

        function disableQuiz() {
            const radioButtons = document.querySelectorAll('input[name="youtuber"]');
            radioButtons.forEach(button => {
                button.disabled = true;
            });
            quizForm.classList.add("disabled");
        }

        function checkAnswer() {
            clearInterval(timerInterval); // Stop the timer
            disableQuiz(); // Disable the quiz options
            const selected = document.querySelector('input[name="youtuber"]:checked');
            if (selected) {
                if (selected.value === "PewDiePie") {
                    document.getElementById("result").innerText = "Correct! PewDiePie is one of the most popular YouTubers.";
                } else {
                    document.getElementById("result").innerText = "Incorrect! The correct answer is PewDiePie.";
                }
            } else {
                document.getElementById("result").innerText = "No answer selected. The correct answer is PewDiePie.";
            }
        }
    </script>

</body>
</html>
